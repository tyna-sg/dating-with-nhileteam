<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dating with NhiLe Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Patrick+Hand&display=swap">
<style>
:root{--bg:#F2F4F1;--surface:#fff;--ink:#14221E;--muted:#586863;--line:#D6DDD8;--kn:#1B6B62;--kn-soft:#DAEDE9;--nk:#B5301D;--nk-soft:#F9DDD6;--br:#8C6A12;--br-soft:#F4EACB;--f:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--hand:'Patrick Hand','Be Vietnam Pro',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1614;--surface:#172220;--ink:#E7EEEA;--muted:#9BADA6;--line:#2B3A35;--kn:#55BBAD;--kn-soft:#173531;--nk:#F27A63;--nk-soft:#3B1D17;--br:#DDBC55;--br-soft:#352D12}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:460px;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;font-size:13px;color:var(--muted)}
.top b{color:var(--ink);font-weight:600}
.back{border:0;background:none;color:var(--kn);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--kn)}
.sub{color:var(--muted);margin:0 0 20px}
.hand{font-family:var(--hand);font-size:20px;color:var(--kn)}
.go{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.03);transition:transform .08s}
.go:active{transform:scale(.985)}
.go .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--c-soft);color:var(--c)}
.go b{display:block;font-size:17px}
.go small{color:var(--muted);font-size:13px}
.go .ar{margin-left:auto;color:var(--muted);font-size:20px}
.c-a{--c:var(--kn);--c-soft:var(--kn-soft)}.c-m{--c:var(--br);--c-soft:var(--br-soft)}.c-b{--c:var(--nk);--c-soft:var(--nk-soft)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 6px}
.prog i{display:block;height:100%;background:var(--kn);width:0;transition:width .25s}
.step{font-size:13px;color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.q{font-size:21px;font-weight:600;line-height:1.3;margin:0 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;margin:0 0 14px}
.tag.v{background:var(--kn-soft);color:var(--kn)}.tag.h{background:var(--br-soft);color:var(--br)}
.note{color:var(--muted);font-size:14px;margin:-6px 0 14px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--kn)}
textarea{min-height:110px;resize:vertical}
.ch{display:block;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:0 0 9px;cursor:pointer;font-size:16px}
.ch input{margin-right:10px;accent-color:var(--kn);transform:scale(1.15)}
.ch:has(input:checked){border-color:var(--kn);background:var(--kn-soft)}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;background:var(--kn);color:#fff}
.btn.alt{background:transparent;color:var(--muted);border:1.5px solid var(--line);flex:0 0 auto;padding:14px 18px}
.btn[disabled]{opacity:.4}
.err{color:var(--nk);font-size:14px;margin-top:8px;min-height:20px}
.done{text-align:center;padding:30px 10px}
.done .big{font-family:var(--hand);font-size:34px;color:var(--kn);margin:0 0 8px}
.search{position:relative;margin:0 0 14px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 12px}
.res h3{margin:0 0 2px;font-size:20px}
.res .job{color:var(--muted);font-size:14px;margin:0 0 12px}
.kv{font-size:15px;margin:0 0 6px}.kv span{color:var(--muted);font-size:12px;display:block;text-transform:uppercase;letter-spacing:.04em}
.meet{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.meet h4{margin:0 0 8px;font-size:14px;color:var(--kn)}
.who{background:var(--kn-soft);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:15px}
.who b{display:block}
.hint{color:var(--muted);font-size:14px;text-align:center}
.demo{position:fixed;left:0;right:0;bottom:0;background:#14221E;color:#fff;font-size:12px;text-align:center;padding:5px 8px;opacity:.92}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="demo">Bản demo giao diện cho khách. Chưa gửi dữ liệu đi đâu.</div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').trim();

/* Câu hỏi Form A, mỗi màn một câu */
const A=[
 {k:'ten',q:'Bạn tên là gì?',t:'text',v:1,ph:'Ví dụ: Lan Chi',req:1},
 {k:'sdt',q:'Số điện thoại hoặc Zalo của bạn?',t:'text',v:0,note:'Chỉ để team nối form cuối buổi. Không hiện cho ai khác.',req:1},
 {k:'nghe',q:'Bạn làm nghề gì, hoặc đang làm gì?',t:'text',v:1,req:1},
 {k:'tim',q:'Bạn đang tìm gì?',t:'area',v:1,note:'Người, việc, hay một điều gì đó trong 3 tháng tới.',req:1},
 {k:'ba',q:'3 từ tả bạn',t:'text',v:1,note:'Bạn tự nói, AI không đoán.',ph:'Ví dụ: tò mò, thẳng, hay cười',req:1},
 {k:'giup',q:'Bạn có thể giúp ai, giúp gì?',t:'area',v:1,req:1},
 {k:'hoc',q:'Bạn đã học Là Chính Mình chưa?',t:'opt',v:0,o:['Rồi','Chưa'],note:'Để team gợi ý đúng bước tiếp cho bạn.',req:1},
 {k:'ai',q:'Hiện giờ bạn dùng AI ở mức nào?',t:'opt',v:0,o:['Chưa dùng bao giờ','Thỉnh thoảng','Hằng tuần','Hằng ngày'],note:'Làm mốc ban đầu, để team biết nên nói gì với bạn.',req:1},
 {k:'dy',q:'Bạn đồng ý để mọi người trong buổi này xem thông tin của bạn không?',t:'opt',v:0,o:['Đồng ý'],note:'Trừ số điện thoại hoặc Zalo, thông tin sẽ hiện cho 15 người trong buổi này. Team giữ lại để giúp mọi người kết nối sau buổi.',req:1,tag:'Bắt buộc'}
];
const B=[
 {k:'sdt',q:'Số điện thoại hoặc Zalo của bạn?',t:'text',v:0,note:'Cùng số bạn đã điền đầu buổi.',req:1},
 {k:'mang',q:'Một điều bạn mang về hôm nay?',t:'area',v:0,req:1},
 {k:'diem',q:'Buổi hôm nay, bạn chấm mấy điểm?',t:'opt',v:0,o:['1','2','3','4','5'],req:1},
 {k:'chua',q:'Điều gì chưa ổn?',t:'area',v:0,note:'Không bắt buộc.',req:0},
 {k:'hoc',q:'Bạn đã học Là Chính Mình chưa?',t:'opt',v:0,o:['Rồi','Chưa'],req:1},
 {k:'tiepR',q:'Bước tiếp bạn muốn?',t:'multi',v:0,o:['Nhận giới thiệu người trong bản đồ kết nối','Nghe về lớp AI','Chưa cần lúc này'],note:'Chọn được nhiều.',req:1,when:a=>a.hoc==='Rồi'},
 {k:'tiepC',q:'Bước tiếp bạn muốn?',t:'multi',v:0,o:['Vào cộng đồng NhiLe Team','Nghe về lớp Là Chính Mình tháng 12 ở Đà Nẵng','Chưa cần lúc này'],note:'Chọn được nhiều.',req:1,when:a=>a.hoc==='Chưa'}
];

/* Dữ liệu mẫu cho Bản đồ kết nối */
const DIR=[
 {n:'Lan Chi',j:'Chủ tiệm bánh, Đà Nẵng',w:'tò mò, thẳng, hay cười',s:'Người biết làm video ngắn cho tiệm',h:'Tư vấn công thức, vận hành tiệm nhỏ',m:[['Minh Khoa','bạn ấy đang làm video bán hàng và cần người hiểu ngành ăn uống'],['Bảo Trâm','bạn ấy cũng mở tiệm nhỏ và đang tìm cách giữ khách quen']]},
 {n:'Minh Khoa',j:'Làm video và nội dung',w:'bình tĩnh, tỉ mỉ, ít nói',s:'Khách đầu tiên cho dịch vụ video',h:'Quay dựng, kể chuyện bằng hình',m:[['Lan Chi','chị ấy cần video cho tiệm và bạn đang tìm khách đầu tiên'],['Bảo Trâm','bạn ấy cần hình ảnh đẹp cho tiệm']]},
 {n:'Bảo Trâm',j:'Mở tiệm trà, TP.HCM',w:'năng động, thực tế, vui',s:'Cách giữ khách quen',h:'Chọn nguyên liệu, nói chuyện với nhà cung cấp',m:[['Lan Chi','cả hai cùng mở tiệm nhỏ, chị ấy có kinh nghiệm giữ khách'],['Minh Khoa','bạn ấy làm hình ảnh cho tiệm trà']]}
];

const st={a:{},i:0,list:A,key:'A'};
const head=(back)=>`<div class="top"><span>${back?'<button class="back" onclick="home()">← Trang chính</button>':'<b>Dating with NhiLe Team</b>'}</span><span>CN 18/10</span></div>`;

function home(){
 app.innerHTML=head(0)+`
 <h1>Chào bạn, mình <em>kết nối</em> nhé.</h1>
 <p class="sub">Buổi hôm nay có 3 chỗ bạn cần tới trang này. Lúc nào cần, bạn bấm đúng nút đó.</p>
 <button class="go c-a" onclick="startForm('A')"><span class="ic">A</span><span><b>Điền thẻ giới thiệu</b><small>Đầu buổi · khoảng 2 phút</small></span><span class="ar">›</span></button>
 <button class="go c-m" onclick="mapView()"><span class="ic">◎</span><span><b>Bản đồ kết nối</b><small>Sau 12:50 · tìm tên bạn, xem nên gặp ai</small></span><span class="ar">›</span></button>
 <button class="go c-b" onclick="startForm('B')"><span class="ic">B</span><span><b>Điền cuối buổi</b><small>Cuối buổi · khoảng 1 phút</small></span><span class="ar">›</span></button>
 <p class="hint" style="margin-top:22px">Số điện thoại hay Zalo của bạn chỉ team thấy.</p>`;
 scrollTo(0,0);
}

function startForm(k){st.key=k;st.list=k==='A'?A:B;st.a={};st.i=0;step()}
function vis(){return st.list.filter(x=>!x.when||x.when(st.a))}
function step(){
 const L=vis(),it=L[st.i],n=L.length,v=st.a[it.k];
 let body='';
 if(it.t==='text')body=`<input type="text" id="f" value="${(v||'').replace(/"/g,'&quot;')}" placeholder="${it.ph||''}" autocomplete="off">`;
 else if(it.t==='area')body=`<textarea id="f">${v||''}</textarea>`;
 else body=it.o.map((o,j)=>{const on=it.t==='multi'?(v||[]).includes(o):v===o;return `<label class="ch"><input type="${it.t==='multi'?'checkbox':'radio'}" name="f" value="${o.replace(/"/g,'&quot;')}" ${on?'checked':''}>${o}</label>`}).join('');
 const tag=it.tag?`<span class="tag h">${it.tag}</span>`:(it.v?'<span class="tag v">Hiện trong bản đồ kết nối</span>':'<span class="tag h">Chỉ team thấy</span>');
 app.innerHTML=head(1)+`<div class="prog"><i style="width:${(st.i)/n*100}%"></i></div><p class="step">Câu ${st.i+1} / ${n}</p>
 <div class="card"><div class="q">${it.q}</div>${tag}${it.note?`<p class="note">${it.note}</p>`:''}${body}<div class="err" id="err"></div></div>
 <div class="nav">${st.i>0?'<button class="btn alt" onclick="prev()">Quay lại</button>':''}<button class="btn" onclick="next()">${st.i===n-1?'Gửi':'Tiếp'}</button></div>`;
 requestAnimationFrame(()=>{const f=$('#f');if(f&&!('ontouchstart' in window))f.focus();
  if(f)f.addEventListener('keydown',e=>{if(e.key==='Enter'&&it.t==='text')next()})});
 scrollTo(0,0);
}
function read(it){
 if(it.t==='text'||it.t==='area')return($('#f').value||'').trim();
 const c=[...document.querySelectorAll('input[name=f]:checked')].map(x=>x.value);
 return it.t==='multi'?c:(c[0]||'');
}
function save(){const it=vis()[st.i];st.a[it.k]=read(it);return it}
function next(){
 const it=save(),v=st.a[it.k];
 if(it.req&&(!v||(Array.isArray(v)&&!v.length))){$('#err').textContent=it.t==='opt'||it.t==='multi'?'Bạn chọn một đáp án nhé.':'Bạn điền giúp mình ô này nhé.';return}
 const L=vis();
 if(st.i<L.length-1){st.i++;step()}else finish();
}
function prev(){save();if(st.i>0){st.i--;step()}}
function finish(){
 const a=st.key==='A';
 app.innerHTML=head(1)+`<div class="card done"><div class="big">Cảm ơn ${a?(st.a.ten||'bạn'):'bạn'}!</div>
 <p>${a?'Thẻ của bạn đã nhận. Sau 12:50, bạn quay lại trang này, bấm “Bản đồ kết nối” và tìm tên mình.':'Mình đã nhận. Team sẽ nhắn cho bạn trước ngày 20/10.'}</p>
 <div class="nav" style="justify-content:center"><button class="btn" style="flex:0 1 220px" onclick="home()">Về trang chính</button></div></div>`;
}

function mapView(){
 app.innerHTML=head(1)+`<h1>Bản đồ kết nối</h1><p class="sub">Gõ tên bạn để xem thẻ của mình và 2 người nên gặp.</p>
 <div class="search"><input type="text" id="q" placeholder="Gõ tên của bạn" autocomplete="off"></div><div id="out"><p class="hint">Thử gõ “lan”, “khoa” hoặc “tram”.</p></div>`;
 $('#q').addEventListener('input',e=>{
  const q=norm(e.target.value);if(!q){$('#out').innerHTML='<p class="hint">Thử gõ “lan”, “khoa” hoặc “tram”.</p>';return}
  const r=DIR.filter(d=>norm(d.n).includes(q));
  $('#out').innerHTML=r.length?r.map(d=>`<div class="res"><h3>${d.n}</h3><p class="job">${d.j}</p>
   <div class="kv"><span>3 từ tả</span>${d.w}</div><div class="kv"><span>Đang tìm</span>${d.s}</div><div class="kv"><span>Có thể giúp</span>${d.h}</div>
   <div class="meet"><h4>Nên gặp</h4>${d.m.map(x=>`<div class="who"><b>${x[0]}</b>${x[1]}</div>`).join('')}<p class="hint" style="text-align:left;margin:8px 0 0">Giờ nghỉ, bạn tới nói chuyện với họ nhé.</p></div></div>`).join(''):'<p class="hint">Không thấy tên này. Thử gõ ít chữ hơn, hoặc nhờ bạn hậu cần.</p>';
 });
 scrollTo(0,0);
}
home();
</script>
</body>
</html>
