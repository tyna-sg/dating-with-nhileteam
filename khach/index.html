<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Dating with NhiLe Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Arimo:wght@400;500;600;700&display=swap">
<style>
/* Brand NhiLe Team: đen, trắng, đỏ #DF0029. Dating dùng màu vàng #FFFF00 trên nền đen (theo ghi chú brand 13/10). Font: Anton (tiêu đề), Arimo (chữ phụ). */
:root{--bg:#000;--surface:#121212;--surface2:#1B1B1B;--ink:#fff;--muted:#939598;--line:#2E2E2E;--y:#FFFF00;--red:#DF0029;--head:'Anton','Arimo',Impact,sans-serif;--body:'Arimo',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;display:flex;justify-content:center;-webkit-text-size-adjust:100%}
.app{width:100%;max-width:460px;padding:16px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 22px;font-size:13px;color:var(--muted)}
.back{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;padding:8px 0}
.wm{display:flex;align-items:baseline;gap:8px}
.wm b{font-family:var(--head);font-weight:400;font-size:26px;letter-spacing:.02em;text-transform:lowercase;color:var(--ink)}
.wm span{font-size:13px;color:var(--muted);letter-spacing:.02em}
.hero{display:block;width:150px;height:auto;margin:6px 0 26px}
h1{font-family:var(--head);font-weight:400;font-size:40px;line-height:1.08;margin:0 0 10px;text-transform:uppercase;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--y)}
h2{font-family:var(--head);font-weight:400;font-size:30px;line-height:1.12;margin:0 0 8px;text-transform:uppercase}
.sub{color:var(--muted);margin:0 0 24px}
.go{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;font:inherit;color:inherit;cursor:pointer;transition:transform .08s,border-color .15s}
.go:active{transform:scale(.985);border-color:var(--y)}
.go .ic{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--head);font-size:24px;background:var(--surface2);color:var(--y)}
.go b{display:block;font-size:18px}
.go small{color:var(--muted);font-size:14px}
.go .ar{margin-left:auto;color:var(--y);font-size:22px}
.prog{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 8px}
.prog i{display:block;height:100%;background:var(--y);width:0;transition:width .25s}
.step{font-size:13px;color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.q{font-size:22px;font-weight:700;line-height:1.28;margin:0 0 12px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 11px;margin:0 0 14px;letter-spacing:.02em}
.tag.v{background:var(--y);color:#000}
.tag.h{border:1px solid var(--muted);color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:-6px 0 14px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#000;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;outline:none;caret-color:var(--y)}
input[type=text]:focus,textarea:focus{border-color:var(--y)}
textarea{min-height:120px;resize:vertical}
::placeholder{color:#6d7073}
.ch{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin:0 0 9px;cursor:pointer;font-size:16px;background:#000}
.ch input{margin-right:12px;accent-color:var(--y);transform:scale(1.2)}
.ch:has(input:checked){border-color:var(--y);background:#1c1c00}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:10px;padding:15px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--y);color:#000;letter-spacing:.02em}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto;padding:15px 18px}
.btn[disabled]{opacity:.45}
.err{margin-top:12px;font-size:14px;padding:0 0 0 10px;border-left:3px solid var(--red);min-height:0;display:none}
.err.on{display:block}
.done{text-align:center;padding:34px 12px}
.done .big{font-family:var(--head);font-size:38px;text-transform:uppercase;color:var(--y);margin:0 0 10px;line-height:1.1}
.search{margin:0 0 14px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 12px}
.res h3{font-family:var(--head);font-weight:400;text-transform:uppercase;margin:0 0 2px;font-size:28px;line-height:1.1}
.res .job{color:var(--muted);font-size:15px;margin:0 0 14px}
.kv{font-size:16px;margin:0 0 8px}.kv span{color:var(--muted);font-size:12px;display:block;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.meet{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.meet h4{margin:0 0 10px;font-family:var(--head);font-weight:400;font-size:20px;text-transform:uppercase;color:var(--y);letter-spacing:.03em}
.who{background:var(--surface2);border-left:3px solid var(--y);border-radius:6px;padding:10px 12px;margin:0 0 8px;font-size:15px}
.who b{display:block;font-size:17px}
.hint{color:var(--muted);font-size:14px;text-align:center}
.demo{position:fixed;left:0;right:0;bottom:0;background:var(--y);color:#000;font-size:12px;font-weight:700;text-align:center;padding:5px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="demo" id="demo" hidden>Bản demo giao diện. Chưa gửi dữ liệu đi đâu.</div>
<script>
/* ===== CẤU HÌNH =====
   API: địa chỉ Apps Script (Thùy dán sau khi triển khai, xem khach/apps-script.gs).
   Để trống thì trang chạy chế độ demo, không gửi gì đi.
   Logo: file logo.png là logo NhiLe TEAM chính thức (bản nền đen, Tyna gửi 17/10), chỉ dùng ở trang chính, rộng 150px (luật brand: tối thiểu 110px). */
const API='';
const $=s=>document.querySelector(s),app=$('#app');
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!API)$('#demo').hidden=false;

const A=[
 {k:'ten',q:'Bạn tên là gì?',t:'text',v:1,ph:'Ví dụ: Lan Chi',req:1},
 {k:'sdt',q:'Số điện thoại hoặc Zalo của bạn?',t:'text',v:0,note:'Chỉ để team nối form cuối buổi. Không hiện cho ai khác.',req:1},
 {k:'nghe',q:'Bạn làm nghề gì, hoặc đang làm gì?',t:'text',v:1,req:1},
 {k:'tim',q:'Bạn đang tìm gì?',t:'area',v:1,note:'Người, việc, hay một điều gì đó trong 3 tháng tới.',req:1},
 {k:'ba',q:'3 từ tả bạn',t:'text',v:1,note:'Bạn tự nói, AI không đoán.',ph:'Ví dụ: tò mò, thẳng, hay cười',req:1},
 {k:'giup',q:'Bạn có thể giúp ai, giúp gì?',t:'area',v:1,req:1},
 {k:'hoc',q:'Bạn đã học Là Chính Mình chưa?',t:'opt',v:0,o:['Rồi','Chưa'],note:'Để team gợi ý đúng bước tiếp cho bạn.',req:1},
 {k:'ai',q:'Hiện giờ bạn dùng AI ở mức nào?',t:'opt',v:0,o:['Chưa dùng bao giờ','Thỉnh thoảng','Hằng tuần','Hằng ngày'],note:'Làm mốc ban đầu, để team biết nên nói gì với bạn.',req:1},
 {k:'dy',q:'Bạn đồng ý để mọi người trong buổi này xem thông tin của bạn không?',t:'opt',v:0,o:['Đồng ý'],note:'Trừ số điện thoại hoặc Zalo, thông tin sẽ hiện cho 15 người trong buổi này. Team giữ lại để giúp mọi người kết nối sau buổi.',req:1,tag:'Bắt buộc'}
];
const B=[
 {k:'sdt',q:'Số điện thoại hoặc Zalo của bạn?',t:'text',v:0,note:'Cùng số bạn đã điền đầu buổi.',req:1},
 {k:'mang',q:'Một điều bạn mang về hôm nay?',t:'area',v:0,req:1},
 {k:'diem',q:'Buổi hôm nay, bạn chấm mấy điểm?',t:'opt',v:0,o:['1','2','3','4','5'],req:1},
 {k:'chua',q:'Điều gì chưa ổn?',t:'area',v:0,note:'Không bắt buộc.',req:0},
 {k:'hoc',q:'Bạn đã học Là Chính Mình chưa?',t:'opt',v:0,o:['Rồi','Chưa'],req:1},
 {k:'tiep',q:'Bước tiếp bạn muốn?',t:'multi',v:0,o:a=>a.hoc==='Rồi'?['Nhận giới thiệu người trong bản đồ kết nối','Nghe về lớp AI','Chưa cần lúc này']:['Vào cộng đồng NhiLe Team','Nghe về lớp Là Chính Mình tháng 12 ở Đà Nẵng','Chưa cần lúc này'],note:'Chọn được nhiều.',req:1}
];
const DIR=[
 {ten:'Lan Chi',nghe:'Chủ tiệm bánh, Đà Nẵng',ba:'tò mò, thẳng, hay cười',tim:'Người biết làm video ngắn cho tiệm',giup:'Tư vấn công thức, vận hành tiệm nhỏ',gap1:'Minh Khoa',ly1:'bạn ấy đang làm video bán hàng và cần người hiểu ngành ăn uống',gap2:'Bảo Trâm',ly2:'bạn ấy cũng mở tiệm nhỏ và đang tìm cách giữ khách quen'},
 {ten:'Minh Khoa',nghe:'Làm video và nội dung',ba:'bình tĩnh, tỉ mỉ, ít nói',tim:'Khách đầu tiên cho dịch vụ video',giup:'Quay dựng, kể chuyện bằng hình',gap1:'Lan Chi',ly1:'chị ấy cần video cho tiệm và bạn đang tìm khách đầu tiên',gap2:'Bảo Trâm',ly2:'bạn ấy cần hình ảnh đẹp cho tiệm'},
 {ten:'Bảo Trâm',nghe:'Mở tiệm trà, TP.HCM',ba:'năng động, thực tế, vui',tim:'Cách giữ khách quen',giup:'Chọn nguyên liệu, nói chuyện với nhà cung cấp',gap1:'Lan Chi',ly1:'cả hai cùng mở tiệm nhỏ, chị ấy có kinh nghiệm giữ khách',gap2:'Minh Khoa',ly2:'bạn ấy làm hình ảnh cho tiệm trà'}
];

const st={a:{},i:0,list:A,key:'A',sending:false};
const wm=()=>`<span class="wm"><b>dating</b><span>with NhiLe Team</span></span>`;
const head=back=>`<div class="top"><span>${back?'<button class="back" onclick="home()">← Trang chính</button>':wm()}</span><span>CN 18/10</span></div>`;

function home(){
 app.innerHTML=`<div class="top"><span class="wm"><b>dating</b><span>with NhiLe Team</span></span><span>CN 18/10</span></div>
 <img class="hero" src="logo.png" width="150" alt="NhiLe TEAM">
 <h1>Chào bạn, mình <em>kết nối</em> nhé.</h1>
 <p class="sub">Buổi hôm nay có 3 chỗ bạn cần tới trang này. Lúc nào cần, bạn bấm đúng nút đó.</p>
 <button class="go" onclick="startForm('A')"><span class="ic">A</span><span><b>Điền thẻ giới thiệu</b><small>Đầu buổi · khoảng 2 phút</small></span><span class="ar">›</span></button>
 <button class="go" onclick="mapView()"><span class="ic">◎</span><span><b>Bản đồ kết nối</b><small>Sau 12:50 · tìm tên bạn, xem nên gặp ai</small></span><span class="ar">›</span></button>
 <button class="go" onclick="startForm('B')"><span class="ic">B</span><span><b>Điền cuối buổi</b><small>Cuối buổi · khoảng 1 phút</small></span><span class="ar">›</span></button>
 <p class="hint" style="margin-top:24px">Số điện thoại hay Zalo của bạn chỉ team thấy.</p>`;
 scrollTo(0,0);
}

/* Tự lưu nháp để lỡ tắt trang vẫn còn */
const dk=k=>'dating1810_'+k;
const draftGet=k=>{try{return JSON.parse(localStorage.getItem(dk(k))||'null')}catch(e){return null}};
const draftSet=(k,v)=>{try{v==null?localStorage.removeItem(dk(k)):localStorage.setItem(dk(k),JSON.stringify(v))}catch(e){}};

function startForm(k){
 if(draftGet('sent'+k)){app.innerHTML=head(1)+`<div class="card done"><div class="big">Bạn đã gửi rồi</div><p>Mình đã nhận ${k==='A'?'thẻ giới thiệu':'phiếu cuối buổi'} của bạn trên máy này. Muốn gửi lại, bấm nút dưới.</p><div class="nav" style="justify-content:center"><button class="btn alt" onclick="draftSet('sent${k}',null);startForm('${k}')">Gửi lại</button><button class="btn" style="flex:0 1 180px" onclick="home()">Về trang chính</button></div></div>`;return}
 st.key=k;st.list=k==='A'?A:B;st.a=draftGet('d'+k)||{};st.i=0;step()
}
const optsOf=it=>typeof it.o==='function'?it.o(st.a):it.o;
function step(){
 const it=st.list[st.i],n=st.list.length,v=st.a[it.k];
 let body='';
 if(it.t==='text')body=`<input type="text" id="f" value="${esc(v||'')}" placeholder="${esc(it.ph||'')}" autocomplete="off" maxlength="300">`;
 else if(it.t==='area')body=`<textarea id="f" maxlength="1500">${esc(v||'')}</textarea>`;
 else body=optsOf(it).map(o=>{const on=it.t==='multi'?(v||[]).includes(o):v===o;return `<label class="ch"><input type="${it.t==='multi'?'checkbox':'radio'}" name="f" value="${esc(o)}" ${on?'checked':''}>${esc(o)}</label>`}).join('');
 const tag=it.tag?`<span class="tag h">${it.tag}</span>`:(it.v?'<span class="tag v">Hiện trong bản đồ kết nối</span>':'<span class="tag h">Chỉ team thấy</span>');
 app.innerHTML=head(1)+`<div class="prog"><i style="width:${st.i/n*100}%"></i></div><p class="step">Câu ${st.i+1} / ${n}</p>
 <div class="card"><div class="q">${it.q}</div>${tag}${it.note?`<p class="note">${it.note}</p>`:''}${body}<div class="err" id="err" role="alert"></div></div>
 <div class="nav">${st.i>0?'<button class="btn alt" onclick="prev()">Quay lại</button>':''}<button class="btn" id="nx" onclick="next()">${st.i===n-1?'Gửi':'Tiếp'}</button></div>`;
 const f=$('#f');if(f){if(!('ontouchstart' in window))f.focus();f.addEventListener('keydown',e=>{if(e.key==='Enter'&&it.t==='text')next()})}
 scrollTo(0,0);
}
function read(it){
 if(it.t==='text'||it.t==='area')return($('#f').value||'').trim();
 const c=[...document.querySelectorAll('input[name=f]:checked')].map(x=>x.value);
 return it.t==='multi'?c:(c[0]||'');
}
function save(){const it=st.list[st.i];st.a[it.k]=read(it);if(it.k==='hoc'&&st.key==='B')delete st.a.tiep;draftSet('d'+st.key,st.a);return it}
function showErr(m){const e=$('#err');e.textContent=m;e.classList.add('on')}
function next(){
 if(st.sending)return;
 const it=save(),v=st.a[it.k];
 if(it.req&&(!v||(Array.isArray(v)&&!v.length))){showErr(it.t==='opt'||it.t==='multi'?'Bạn chọn một đáp án nhé.':'Bạn điền giúp mình ô này nhé.');return}
 if(st.i<st.list.length-1){st.i++;step()}else submit();
}
function prev(){save();if(st.i>0){st.i--;step()}}

async function submit(){
 const btn=$('#nx');
 if(!API){finish();return}
 st.sending=true;btn.disabled=true;btn.textContent='Đang gửi…';
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:st.key,data:st.a}),redirect:'follow'});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'loi');
  draftSet('sent'+st.key,1);draftSet('d'+st.key,null);finish();
 }catch(e){
  st.sending=false;btn.disabled=false;btn.textContent='Gửi lại';
  showErr('Chưa gửi được, có thể mạng đang yếu. Câu trả lời của bạn vẫn còn đây, bạn bấm “Gửi lại” nhé. Nếu vẫn lỗi, nhờ bạn hậu cần.');
 }
}
function finish(){
 st.sending=false;
 const a=st.key==='A';
 app.innerHTML=head(1)+`<div class="card done"><div class="big">Cảm ơn ${a?esc(st.a.ten||'bạn'):'bạn'}!</div>
 <p>${a?'Thẻ của bạn đã nhận. Sau 12:50, bạn quay lại trang này, bấm “Bản đồ kết nối” và tìm tên mình.':'Mình đã nhận. Team sẽ nhắn cho bạn trước ngày 20/10.'}</p>
 <div class="nav" style="justify-content:center"><button class="btn" style="flex:0 1 220px" onclick="home()">Về trang chính</button></div></div>`;
 scrollTo(0,0);
}

/* Bản đồ kết nối: đọc từ Google Sheet qua Apps Script (hoặc dữ liệu mẫu khi demo) */
async function loadMap(){
 if(!API)return DIR;
 const r=await fetch(API+'?action=map',{redirect:'follow'});const j=await r.json();
 if(!j.ok)throw new Error('map');return j.rows||[];
}
const card=d=>`<div class="res"><h3>${esc(d.ten)}</h3><p class="job">${esc(d.nghe)}</p>
 <div class="kv"><span>3 từ tả</span>${esc(d.ba)}</div><div class="kv"><span>Đang tìm</span>${esc(d.tim)}</div><div class="kv"><span>Có thể giúp</span>${esc(d.giup)}</div>
 ${(d.gap1||d.gap2)?`<div class="meet"><h4>Nên gặp</h4>${[[d.gap1,d.ly1],[d.gap2,d.ly2]].filter(x=>x[0]).map(x=>`<div class="who"><b>${esc(x[0])}</b>${x[1]?esc(x[1]):''}</div>`).join('')}<p class="hint" style="text-align:left;margin:10px 0 0">Giờ nghỉ, bạn tới nói chuyện với họ nhé.</p></div>`:`<div class="meet"><p class="hint" style="text-align:left;margin:0">Gợi ý “nên gặp” của bạn đang được chuẩn bị. Quay lại sau ít phút.</p></div>`}</div>`;
async function mapView(){
 app.innerHTML=head(1)+`<h2>Bản đồ kết nối</h2><p class="sub">Gõ tên bạn để xem thẻ của mình và 2 người nên gặp.</p>
 <div class="search"><input type="text" id="q" placeholder="Gõ tên của bạn" autocomplete="off" disabled></div><div id="out"><p class="hint">Đang tải bản đồ…</p></div>`;
 let rows=[];
 try{rows=await loadMap()}catch(e){
  $('#out').innerHTML='<p class="hint">Chưa tải được bản đồ. Bạn thử lại sau ít giây, hoặc nhờ bạn hậu cần.</p><div class="nav" style="justify-content:center"><button class="btn" style="flex:0 1 200px" onclick="mapView()">Tải lại</button></div>';return}
 if(!rows.length){$('#out').innerHTML='<p class="hint">Bản đồ đang được chuẩn bị. Bạn quay lại sau 12:50 nhé.</p><div class="nav" style="justify-content:center"><button class="btn" style="flex:0 1 200px" onclick="mapView()">Tải lại</button></div>';return}
 const hintTxt=API?'Gõ vài chữ đầu của tên bạn.':'Thử gõ “lan”, “khoa” hoặc “tram”.';
 $('#out').innerHTML=`<p class="hint">${hintTxt}</p>`;
 const q=$('#q');q.disabled=false;
 q.addEventListener('input',e=>{
  const s=norm(e.target.value);if(!s){$('#out').innerHTML=`<p class="hint">${hintTxt}</p>`;return}
  const r=rows.filter(d=>norm(d.ten).includes(s)).slice(0,5);
  $('#out').innerHTML=r.length?r.map(card).join(''):'<p class="hint">Không thấy tên này. Thử gõ ít chữ hơn, hoặc nhờ bạn hậu cần.</p>';
 });
 scrollTo(0,0);
}
home();
</script>
</body>
</html>
